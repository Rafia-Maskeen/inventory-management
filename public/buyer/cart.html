<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .cart-page {
      max-width: 900px;
      margin: 0 auto;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cart-header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .cart-header h2 {
      font-size: 28px;
      color: #333;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cart-header h2 i {
      color: #667eea;
      font-size: 32px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .back-button i {
      font-size: 16px;
    }

    .cart-container {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
      min-height: 300px;
    }

    #cartItems {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 2px solid #f0f0f0;
      transition: all 0.3s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .cart-item:hover {
      border-color: #667eea;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      transform: translateX(5px);
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-size: 18px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .cart-item-info p {
      color: #666;
      font-size: 15px;
      margin: 4px 0;
    }

    .price-highlight {
      color: #43e97b;
      font-weight: 700;
      font-size: 16px;
    }

    .remove-btn {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .remove-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

    .cart-summary {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 20px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .cart-total h3 {
      font-size: 24px;
      color: #333;
      font-weight: 700;
    }

    .total-amount {
      font-size: 32px;
      color: #667eea;
      font-weight: 800;
    }

    .checkout-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .checkout-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(67, 233, 123, 0.5);
    }

    .checkout-btn i {
      font-size: 20px;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-cart i {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.3;
      color: #667eea;
    }

    .empty-cart h3 {
      font-size: 24px;
      color: #666;
      margin-bottom: 10px;
    }

    .empty-cart p {
      font-size: 16px;
      margin-bottom: 30px;
    }

    .shop-now-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .shop-now-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    @media (max-width: 768px) {
      .cart-header {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }

      .cart-item {
        flex-direction: column;
        text-align: center;
      }

      .cart-item img {
        width: 100%;
        height: 200px;
      }

      .total-amount {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<div class="cart-page">
  <div class="cart-header">
    <h2>
      <i class="fas fa-shopping-cart"></i>
      Your Shopping Cart
    </h2>
    <button class="back-button" onclick="window.history.back()">
      <i class="fas fa-arrow-left"></i>
      Continue Shopping
    </button>
  </div>

  <div class="cart-container">
    <div id="cartItems"></div>
  </div>

  <div class="cart-summary">
    <div class="cart-total">
      <h3>Total:</h3>
      <span class="total-amount" id="cartTotal">$0.00</span>
    </div>
    
    <button class="checkout-btn" onclick="goCheckout()">
      <i class="fas fa-lock"></i>
      Proceed to Checkout
    </button>
  </div>
</div>

<script src="./cart.js"></script>
</body>
</html>
